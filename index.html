<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Notes and Todos</title><style>body{font:18px system-ui;max-width:48rem;margin:3rem auto;padding:1rem}textarea,input,button{font:inherit;padding:.5rem}textarea{width:95%;height:10rem}li{margin:.7rem 0}button{margin-left:.5rem}</style></head><body><h1>Local Notes and Todos</h1><p>Everything stays in this browser's localStorage. No account, server, backend, or cross-device sync.</p><label for="notes">Notes</label><textarea id="notes"></textarea><p id="status" role="status"></p><form id="add"><label for="todo">New todo</label><input id="todo" required><button>Add</button></form><ul id="todos"></ul><script>
const key='local-notes-todos-v1';
let state=JSON.parse(localStorage.getItem(key)||'{"notes":"","todos":[]}');
const notes=document.getElementById('notes'),todos=document.getElementById('todos');
function save(){localStorage.setItem(key,JSON.stringify(state));document.getElementById('status').textContent='Saved in this browser only';}
function render(){todos.replaceChildren();state.todos.forEach((todo,i)=>{const li=document.createElement('li'),check=document.createElement('input'),text=document.createElement('span'),remove=document.createElement('button');check.type='checkbox';check.checked=todo.done;check.setAttribute('aria-label','Complete '+todo.text);check.onchange=()=>{todo.done=check.checked;save();render();};text.textContent=todo.text;text.style.textDecoration=todo.done?'line-through':'';remove.textContent='Remove';remove.onclick=()=>{state.todos.splice(i,1);save();render();};li.append(check,text,remove);todos.append(li);});}
notes.value=state.notes;notes.oninput=()=>{state.notes=notes.value;save();};document.getElementById('add').onsubmit=e=>{e.preventDefault();const input=document.getElementById('todo');state.todos.push({text:input.value,done:false});input.value='';save();render();};render();
</script></body></html>
